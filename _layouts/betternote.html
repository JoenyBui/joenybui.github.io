<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <style>
      :root {
        --bg: #ffffff;
        --text: #1d1d1f;
        --muted: #6e6e73;
        --accent: #0a66c2;
        --rule: #e5e5ea;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111113;
          --text: #f5f5f7;
          --muted: #a1a1a6;
          --accent: #4ea1ff;
          --rule: #2c2c2e;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .shell { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
      nav { display: flex; gap: 20px; align-items: baseline; border-bottom: 1px solid var(--rule); padding-bottom: 12px; margin-bottom: 32px; }
      nav .brand { font-weight: 700; color: var(--text); text-decoration: none; margin-right: auto; }
      nav a { color: var(--muted); text-decoration: none; }
      nav a[aria-current="page"] { color: var(--text); }
      a { color: var(--accent); }
      h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 16px; }
      h2 { font-size: 1.25rem; margin: 32px 0 8px; }
      footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav aria-label="BetterNote">
        <a class="brand" href="/betternote/support/">BetterNote</a>
        <a href="/betternote/support/"{% if page.url == "/betternote/support/" %} aria-current="page"{% endif %}>Support</a>
        <a href="/betternote/privacy/"{% if page.url == "/betternote/privacy/" %} aria-current="page"{% endif %}>Privacy</a>
      </nav>
      <main>
        {{ content }}
      </main>
      <footer>&copy; {{ "now" | date: "%Y" }} Joeny Bui</footer>
    </div>
  </body>
</html>
